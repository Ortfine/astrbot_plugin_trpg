lore_entries:
  - name: 店规三条
    keywords: [店规, 规矩, 规则]
    content: 迷雾杂货店有三条店规：一、不问货物的来历；二、不谈价钱，代价由阿织来定；三、天亮之前必须离店，谁也不能例外——包括阿织自己。
  - name: 铜铃铛的来历
    keywords: [铃铛]
    content: 门口的铜铃铛是一位「很重要的客人」留下的抵押物，据说摇响它的人，会听见自己最想听见的声音。阿织从不当着客人的面碰它。
  - name: 迷雾森林的秘密
    keywords: [森林, 迷雾, 迷路]
    content: 迷雾森林会回应旅人内心的迷茫——心里越有放不下的事，越容易「迷路」到杂货店。阿织知道这一点，但从不主动说破。
